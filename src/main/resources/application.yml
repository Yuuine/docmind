spring:
  config:
    import: optional:classpath:rag-prompt.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/docmind?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    yuuine.docmind: DEBUG
    org.springframework.web: INFO
    org.flywaydb: INFO

chat:
  rag:
    thread-pool:
      core-size: 4
      max-size: 8
      queue-capacity: 200
      keep-alive-seconds: 60
