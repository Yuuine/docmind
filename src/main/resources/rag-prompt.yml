# =============================================================================
# RAG 提示词与检索（由 spring.config.import 加载，可被环境或 profile 覆盖）
# 绑定类：
#   - rag.prompt.*           → RagPromptProperties
#   - rag.prompt.history.*   → HistoryMessageProperties（预留 / 其他组装逻辑）
#   - rag.retrieval.*        → RagRetrievalProperties
# =============================================================================

rag:
  # ---------------------------------------------------------------------------
  # 对话提示：系统人设、历史轮数、用户消息里的「问题 / 参考资料」模板
  # 占位符：{query}、{context} 勿删；多行 system 建议用 | 块
  # ---------------------------------------------------------------------------
  prompt:
    system: |
      你是「潇潇」，一位严谨的文档问答助手。
      请仅依据下方「参考资料」中的内容作答；资料不足以回答时请明确说明，不要编造。
      回答简洁、分点清晰，必要时使用 Markdown。
    # 与 PromptAssembler 中历史截断一致：最近 N 个「轮次」（按 user+assistant 估算，约 max-history-rounds * 2 条消息）
    max-history-rounds: 10
    # 合成在单条 user 消息里、接在「当前问题」之后的段落；{context} 为检索拼接后的正文
    context-template: |
      参考资料：
      {context}
    # 合成在单条 user 消息里、通常与上文的「最后一条 USER」去重后单独出现；{query} 为用户原文
    query-template: |
      当前问题：
      {query}

    # 请求参数 ragEnabled=false 时使用（不检索、不注入参考资料），避免与「仅依据资料」冲突
    system-without-rag: |
      你是「潇潇」，友善、简洁的助手。
      当前对话未挂载文档知识库，请基于通用知识回答；不确定时请说明。勿假装已阅读用户上传的文档。
    # 历史中每条 assistant 的最大字符数（0=不截断），减轻长代码/JSON 占满上下文
    max-assistant-content-chars: 3500

    # HistoryMessageBuilder*
    history:
      enabled: true
      max-rounds: 10
      include-system-prompt: true
      include-context: true

  # ---------------------------------------------------------------------------
  # 检索：向量召回条数、是否重排、重排后送入上下文的条数
  # 向量检索范围由业务按用户文档 ID 过滤（见 ChatServiceImpl / vector fileIds）
  # ---------------------------------------------------------------------------
  retrieval:
    # 向量库相似检索返回的最大 chunk 数
    top-k: 8
    # 为 false 时跳过 Rerank，直接使用向量检索顺序
    rerank-enabled: false
    # 重排后实际写入 prompt 的 chunk 数（≤ 检索返回条数）
    rerank-top-k: 5

    # ---------------------------------------------------------------------------
    # 置信度检测：多维度置信度评分算法
    # 算法：confidenceScore = w1*TopK均值 + w2*Top1 - w3*标准差 + w4*数量得分
    # 分数归一化到 [0, 1]，阈值默认为 0.5
    # ---------------------------------------------------------------------------
    # 基础阈值：置信度评分低于此值时认为检索不相关
    confidence-threshold: 0.5
    # 是否在检索结果不相关时启用友好提示
    friendly-prompt-enabled: true
    # 友好提示语（当检索不相关时使用）
    friendly-prompt: "抱歉，我目前没有找到与您问题相关的资料。请您上传相关文档，或者换个问题试试~"

    # 多维度置信度算法配置
    # 用于计算 Top-K 平均分数的 K 值（取排名靠前的 K 个结果的均值，更稳定）
    confidence-top-k: 3
    # Top-K 平均分数权重（值越大表示越依赖高分结果的一致性）
    top-k-weight: 0.4
    # 最高分权重（单文档最高分数的权重）
    top1-weight: 0.3
    # 标准差权重（越低越好，衡量结果分布的离散程度）
    stddev-weight: 0.2
    # 结果数量权重（数量充足时为1，不足时按比例降低）
    count-weight: 0.1
    # 单文档最低分数要求（ChromaDB 分数，低于此值置信度打折）
    min-top1-score: -25.0
    # 最少结果数量要求（低于此值数量得分打折）
    min-results: 2
    # ChromaDB 分数范围（用于归一化）
    score-range-min: -30.0
    score-range-max: 0.0

    # 丢弃过短 chunk（字符数），减少分块/解析噪声；0 表示关闭
    min-chunk-content-length: 20
    # 可选：向量 score 下限（越高越相似），不配置或注释掉表示不按 score 过滤
    # min-hit-score: 0.15
